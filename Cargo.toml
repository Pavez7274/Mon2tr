[package]
name    = "mon2tr"
version = "0.0.1"
edition = "2024"

[profile.release]
codegen-units = 1
opt-level     = 3
strip         = "symbols"
panic         = "abort"
lto           = "fat"
debug         = 0

[lib]
crate-type = ["cdylib"]

[[bench]]
name    = "fuck_vec"
harness = false

[dev-dependencies]
criterion = "0.7.0"

[dependencies]
napi-derive = "3.4.0"
napi-sys    = "3.2.1"
napi        = { version = "3.6.1", features = ["tokio_rt"] }

webpki-roots        = "1.0.4"
tokio-rustls        = "0.26.4"
tokio   = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net"] }
rustls-native-certs = "0.8.2"
rustls              = "0.23.35"

hpack = "0.3.0"
http  = "1.4.0"
url   = "2.5.7"
h2    = "0.4.12"

once_cell = "1.21.3"
anyhow    = "1.0.100"
bytes     = "1.11.0"
simdutf8 = "0.1.5"

[build-dependencies]
napi-build = "2.3.1"
