[package]
name    = "mon2tr"
version = "0.0.1"
edition = "2024"

[profile.release]
codegen-units = 1
opt-level     = 3
strip         = "symbols"
panic         = "abort"
debug         = false
lto           = "fat"

[lib]
crate-type = ["cdylib"]

[[bench]]
name    = "fuck_vec"
harness = false

[dev-dependencies]
criterion = "0.7.0"

[dependencies]
napi-derive = "3.2.5"
napi-sys    = "3.0.0"
napi        = { version = "3.3.0", features = ["tokio_rt"] }

webpki-roots        = "1.0.2"
tokio-rustls        = "0.26.2"
tokio   = { version = "1.47.1", features = ["rt-multi-thread", "macros", "net"] }
rustls-native-certs = "0.8.1"
rustls              = "0.23.31"

hpack = "0.3.0"
http  = "1.3.1"
url   = "2.5.7"
h2    = "0.4.12"

once_cell = "1.21.3"
anyhow    = "1.0.99"
bytes     = "1.10.1"

[build-dependencies]
napi-build = "2.2.3"
